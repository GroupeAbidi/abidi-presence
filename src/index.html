<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>حضور المجموعة — إدارة الحضور والمناوبات</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ح</div>
        <div><strong>حضور المجموعة</strong><small>إدارة الموظفين والمناوبات</small></div>
      </div>
      <div class="nav-caption">القائمة الرئيسية</div>
      <nav id="navigation" aria-label="قائمة التنقل">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span> لوحة التحكم</button>
        <button class="nav-item" data-page="attendance"><span class="nav-icon">▦</span> تسجيل الحضور</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▤</span> التقارير والتحليل</button>
        <button class="nav-item" id="managerNav" data-page="manager" hidden><span class="nav-icon">✓</span> مراقبة pointeuse</button>
      </nav>
      <div class="nav-caption">الإدارة</div>
      <nav aria-label="إدارة البيانات">
        <button class="nav-item" data-page="companies"><span class="nav-icon">▥</span> الشركات</button>
        <button class="nav-item" data-page="employees"><span class="nav-icon">♙</span> الموظفون</button>
        <button class="nav-item" data-page="shifts"><span class="nav-icon">◷</span> فترات العمل</button>
      </nav>
      <div class="nav-caption">النظام</div>
      <nav aria-label="الإعدادات والمساعدة">
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span> الإعدادات والنسخ</button>
        <button class="nav-item" data-page="help"><span class="nav-icon">?</span> دليل الاستخدام</button>
      </nav>
      <div class="side-bottom"><span class="online-dot"></span><span>يعمل محليًا دون إنترنت</span><small>بياناتك محفوظة على هذا الحاسوب</small></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb"><span id="groupTitle">المجموعة</span><span class="slash">/</span><span id="crumbCurrent">لوحة التحكم</span></div>
        <div class="topbar-end"><span class="top-date" id="topDate"></span><span class="user-circle" id="userInitial">إ</span><span class="user-label" id="userLabel">إدارة الموارد البشرية</span><button class="btn sm" data-action="logout">تسجيل الخروج</button></div>
      </header>
      <div class="main-scroll"><section id="content" class="content"><div class="loading">جاري تحميل البيانات…</div></section></div>
    </main>
  </div>
  <div id="modalHost"></div><div id="toastHost" aria-live="polite"></div>
  <script src="punch-utils.js" defer></script><script src="app.js" defer></script>
</body>
</html>
